<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex Futurista</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dark text-light">
    <div class="container-fluid py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8">
                <h1 class="text-center mb-5 display-4 fw-bold text-neon">Pokédex Futurista</h1>
                <!-- Barra de pesquisa -->
                <div class="mb-4">
                    <input type="text" id="search-input" class="form-control search-input" placeholder="Pesquisar Pokémon por nome...">
                </div>
                <!-- Spinner de carregamento -->
                <div id="loading-spinner" class="d-flex justify-content-center mb-4">
                    <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
                        <span class="visually-hidden">Carregando...</span>
                    </div>
                </div>
                <!-- Grid de cards -->
                <div id="pokemon-grid" class="row g-4 d-none">
                    <!-- Cards serão inseridos aqui via JavaScript -->
                </div>
                <!-- Alerta de erro -->
                <div id="error-alert" class="alert alert-danger d-none" role="alert">
                    <strong>Erro!</strong> Não foi possível carregar os Pokémon. Tente novamente mais tarde.
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- JavaScript Personalizado -->
    <script src="js/script.js"></script>
</body>
</html>
